name: Deploy Blazor WASM to GitHub Pages (branch-based)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# --- EDIT THESE 3 VALUES --------------------------------------------
env:
  PROJECT_PATH: LL-99.github.io.csproj   # path to your Blazor WASM .csproj at repo root
  BASE_PATH: /                           # user/org site => "/"
  PUBLISH_DIR: ${{ github.workspace }}/build/wwwroot
# --------------------------------------------------------------------

# We push to another branch, so we need write access to contents.
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Publish (Release)
        run: dotnet publish "$PROJECT_PATH" -c Release -o build

      - name: Rewrite <base href> for GitHub Pages
        run: |
          index="$PUBLISH_DIR/index.html"
          sed -i 's#<base href="/"\( *\/\)?>#<base href="'"$BASE_PATH"'" />#g' "$index"

      - name: Add .nojekyll and SPA 404 fallback
        run: |
          touch "$PUBLISH_DIR/.nojekyll"
          cp "$PUBLISH_DIR/index.html" "$PUBLISH_DIR/404.html"

      - name: Deploy built site to 'blazor' branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: blazor
          folder: ${{ env.PUBLISH_DIR }}
          clean: true
          commit-message: "Deploy to GitHub Pages"
          single-commit: true
